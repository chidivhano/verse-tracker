<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scripture Help & Character Index</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent-1: #0284c7;
      --accent-2: #059669;
      --accent-3: #d97706;
      --accent-4: #e11d48;
      --pill-bg: #f1f5f9;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px 64px;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, #ffffff 0%, #f0f9ff 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .rainbow-pill {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      color: #ffffff;
      letter-spacing: 0.02em;
    }

    .p-blue { background: linear-gradient(90deg, #0284c7, #38bdf8); }
    .p-green { background: linear-gradient(90deg, #059669, #34d399); }
    .p-amber { background: linear-gradient(90deg, #d97706, #fbbf24); }
    .p-rose { background: linear-gradient(90deg, #e11d48, #fb7185); }

    h1 {
      font-size: clamp(1.6rem, 3vw, 2.25rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: var(--text);
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.98rem;
      max-width: 720px;
    }

    .controls {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      position: sticky;
      top: 12px;
      z-index: 20;
    }

    .search-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .search-input {
      flex: 1;
      padding: 13px 16px;
      font-size: 1rem;
      border: 2px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: #ffffff;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-1);
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12);
    }

    .clear-btn {
      padding: 13px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--pill-bg);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .clear-btn:hover {
      background: #e2e8f0;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-btn:hover {
      transform: translateY(-1px);
      border-color: #cbd5e1;
    }

    .filter-btn.active[data-cat="All"] {
      background: linear-gradient(90deg, #0284c7, #059669, #d97706, #e11d48);
      color: #fff;
      border-color: transparent;
    }

    .filter-btn.active[data-cat="Where to Find Help"] {
      background: #0284c7;
      color: #fff;
      border-color: #0284c7;
    }

    .filter-btn.active[data-cat="Life's Problems"] {
      background: #e11d48;
      color: #fff;
      border-color: #e11d48;
    }

    .filter-btn.active[data-cat="Virtues & Character"] {
      background: #059669;
      color: #fff;
      border-color: #059669;
    }

    .stats {
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      border-top: 4px solid var(--accent-1);
    }

    .card[data-cat="Life's Problems"] {
      border-top-color: var(--accent-4);
    }

    .card[data-cat="Virtues & Character"] {
      border-top-color: var(--accent-2);
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 10px;
    }

    .topic-title {
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--text);
    }

    .cat-tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
      background: var(--pill-bg);
      color: var(--text);
    }

    .verse-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .verse-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      font-size: 0.92rem;
      padding: 5px 8px;
      border-radius: 8px;
      background: #f8fafc;
    }

    .verse-ref {
      font-weight: 600;
      color: #1e293b;
    }

    .page-num {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      background: var(--card);
      border: 1px dashed #cbd5e1;
      border-radius: 16px;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .search-row {
        flex-direction: column;
        align-items: stretch;
      }
      .controls {
        top: 8px;
        padding: 14px;
      }
    }
  </style>
</head>

    const searchInput = document.getElementById("searchInput");
    const clearBtn = document.getElementById("clearBtn");
    const filterPills = document.getElementById("filterPills");
    const cardsGrid = document.getElementById("cardsGrid");
    const statsLabel = document.getElementById("statsLabel");

    let activeCategory = "All";

    function renderCards() {
      const query = searchInput.value.trim().toLowerCase();

      const filtered = INDEX_DATA.filter((item) => {
        const matchesCat = activeCategory === "All" || item.category === activeCategory;
        if (!matchesCat) return false;

        if (!query) return true;

        const topicMatch = item.topic.toLowerCase().includes(query);
        const catMatch = item.category.toLowerCase().includes(query);
        const verseMatch = item.verses.some(
          (v) => v.ref.toLowerCase().includes(query) || v.page.toLowerCase().includes(query)
        );

        return topicMatch || catMatch || verseMatch;
      });

      statsLabel.textContent = `Showing ${filtered.length} of ${INDEX_DATA.length} topics`;

      if (filtered.length === 0) {
        cardsGrid.innerHTML = `
          <div class="empty-state">
            <h3>No matching verses or topics found</h3>
            <p>Try searching another word like "Peace", "Psalm 91", "Anger", or click Reset.</p>
          </div>
        `;
        return;
      }

      cardsGrid.innerHTML = filtered
        .map((item) => {
          const versesHtml = item.verses
            .map(
              (v) => `
              <li class="verse-item">
                <span class="verse-ref">${v.ref}</span>
                <span class="page-num">p. ${v.page}</span>
              </li>
            `
            )
            .join("");

          return `
            <article class="card" data-cat="${item.category}">
              <div>
                <div class="card-top">
                  <h2 class="topic-title">${item.topic}</h2>
                  <span class="cat-tag">${item.category}</span>
                </div>
                <ul class="verse-list">${versesHtml}</ul>
              </div>
            </article>
          `;
        })
        .join("");
    }

    searchInput.addEventListener("input", renderCards);

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      activeCategory = "All";
      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.cat === "All");
      });
      renderCards();
      searchInput.focus();
    });

    filterPills.addEventListener("click", (e) => {
      const btn = e.target.closest(".filter-btn");
      if (!btn) return;

      activeCategory = btn.dataset.cat;
      document.querySelectorAll(".filter-btn").forEach((b) => {
        b.classList.toggle("active", b === btn);
      });
      renderCards();
    });

    renderCards();
  </script>
